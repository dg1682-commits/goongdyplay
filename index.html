<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAY 플레이어</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" />
    <style>
        /* 기존 완벽한 디자인 그대로 유지 */
        body { margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; color: #333; font-weight: 300; }
        .app-container { background: #ffffff; border-radius: 30px; width: 90%; max-width: 340px; min-height: 550px; max-height: 90vh; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04); border: 1px solid #f1f1f1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .view { display: none; flex-direction: column; flex: 1; padding: 35px 25px 80px 25px; overflow-y: auto; box-sizing: border-box; height: 100%; }
        .view.active { display: flex; }
        .app-title { font-size: 18px; color: #ff6b81; margin-bottom: 30px; font-weight: 500; letter-spacing: 1px; text-align: center; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header-row h2 { font-size: 18px; font-weight: 500; margin: 0; display: flex; align-items: center; }
        .action-btn { background: none; border: 1px solid #ff6b81; color: #ff6b81; padding: 6px 14px; border-radius: 15px; font-size: 13px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; }
        .action-btn:hover { background: #ff6b81; color: #fff; }
        .back-btn { cursor: pointer; color: #666; margin-right: 10px; font-size: 24px; transition: 0.2s; }
        .back-btn:hover { color: #ff6b81; }
        
        /* 플레이어 뷰 */
        .album-art { width: 180px; height: 180px; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); border-radius: 50%; margin: 0 auto 25px auto; border: 1px solid #eee; transition: transform 0.3s; }
        .album-art.playing { animation: spin 10s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .song-info { text-align: center; }
        .song-info h2 { margin: 0 0 8px 0; font-size: 18px; font-weight: 400; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-info p { margin: 0 0 25px 0; font-size: 13px; color: #999; }
        .progress-container { background: #f0f0f0; border-radius: 10px; height: 5px; width: 100%; margin-bottom: 30px; cursor: pointer; position: relative; }
        .progress-bar { background: #ff6b81; height: 100%; border-radius: 10px; width: 0%; pointer-events: none; }
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 10px; }
        .controls button { background: none; border: none; cursor: pointer; color: #bbb; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .controls button.active-state { color: #ff6b81; } /* 활성화 상태 색상 */
        .controls button:hover { color: #ff6b81; }
        .material-symbols-outlined { font-size: 28px; }
        .play-btn .material-symbols-outlined { font-size: 46px; color: #ff6b81; }

        /* 리스트 스타일 */
        .list-container { list-style: none; padding: 0; margin: 0; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 10px; border-bottom: 1px solid #f5f5f5; cursor: pointer; transition: background 0.2s; }
        .list-item.playing-now { background: #fff0f2; }
        .list-item:hover { background: #fafafa; }
        .list-item .text { font-size: 14px; color: #444; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 400; }
        .list-item .icon { color: #ccc; font-size: 20px; }
        .delete-btn { color: #eee; cursor: pointer; font-size: 18px; transition: 0.2s; padding-left: 10px; }
        .delete-btn:hover { color: #ff6b81; }

        /* 하단 네비게이션 */
        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: 60px; background: #fff; border-top: 1px solid #f1f1f1; display: flex; justify-content: space-around; align-items: center; z-index: 10; }
        .nav-btn { background: none; border: none; cursor: pointer; color: #ccc; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 33%; transition: 0.2s; }
        .nav-btn.active { color: #ff6b81; }
        .nav-btn .nav-text { font-size: 15px; font-weight: 500; font-family: 'Noto Sans KR', sans-serif; }
        .nav-btn .peach-icon { font-size: 24px; font-style: normal; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- 1. 플리 (현재 재생 목록) 뷰 -->
        <div id="currentPlaylistView" class="view">
            <div class="header-row">
                <h2>플레이 리스트</h2>
            </div>
            <ul class="list-container" id="nowPlayingList">
                <p id="emptyPliText" style="text-align:center; color:#ccc; font-size:13px; margin-top:40px;">현재 대기 중인 곡이 없습니다.</p>
            </ul>
        </div>

        <!-- 2. 메인 플레이어 뷰 -->
        <div id="playerView" class="view active">
            <div class="app-title">PLAY</div>
            <div class="album-art" id="albumArt"></div>
            <div class="song-info">
                <h2 id="title">선택된 곡 없음</h2>
                <p id="artist">재생목록에서 곡을 추가하세요</p>
            </div>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progress"></div>
            </div>
            <div class="controls">
                <button id="shuffleBtn" title="랜덤 재생"><span class="material-symbols-outlined">shuffle</span></button>
                <button id="prevBtn" title="이전 곡"><span class="material-symbols-outlined">skip_previous</span></button>
                <button id="playBtn" class="play-btn" title="재생/일시정지"><span class="material-symbols-outlined">play_arrow</span></button>
                <button id="nextBtn" title="다음 곡"><span class="material-symbols-outlined">skip_next</span></button>
                <button id="repeatBtn" title="반복 재생"><span class="material-symbols-outlined">repeat</span></button>
            </div>
        </div>

        <!-- 3. 재생목록 (폴더 리스트) 뷰 -->
        <div id="playlistsView" class="view">
            <div class="header-row">
                <h2>나의 재생목록</h2>
                <button class="action-btn" onclick="createNewFolder()">+ 새 목록</button>
            </div>
            <ul class="list-container" id="folderList">
                <!-- 폴더 동적 렌더링 영역 -->
            </ul>
        </div>

        <!-- 4. 특정 재생목록 (폴더 상세) 뷰 -->
        <div id="folderDetailView" class="view">
            <div class="header-row">
                <h2>
                    <span class="material-symbols-outlined back-btn" onclick="showView('playlistsView', 'nav-list')">arrow_back</span>
                    <span id="detailFolderName" style="outline:none;">폴더명</span>
                </h2>
                <label class="action-btn">
                    + 곡 추가
                    <input type="file" accept="audio/*" multiple style="display:none;" onchange="addSongsToCurrentFolder(this)">
                </label>
            </div>
            <ul class="list-container" id="detailSongList">
                <!-- 곡 동적 렌더링 영역 -->
            </ul>
        </div>

        <!-- 하단 네비게이션 -->
        <div class="bottom-nav">
            <button class="nav-btn" id="nav-pli" onclick="showView('currentPlaylistView', 'nav-pli')">
                <span class="nav-text">플리</span>
            </button>
            <button class="nav-btn active" id="nav-player" onclick="showView('playerView', 'nav-player')">
                <span class="peach-icon">🍑</span>
            </button>
            <button class="nav-btn" id="nav-list" onclick="showView('playlistsView', 'nav-list')">
                <span class="material-symbols-outlined">menu</span>
            </button>
        </div>

    </div>

    <!-- 숨겨진 오디오 객체 -->
    <audio id="audio"></audio>

    <!-- Firebase SDK (모듈 방식) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        
        // 유저 제공 Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyCFhPO1Ttt1mZJ2DWU5R6yuLx3r9_L7mPI",
            authDomain: "isvmlivepage.firebaseapp.com",
            projectId: "isvmlivepage",
            storageBucket: "isvmlivepage.firebasestorage.app",
            messagingSenderId: "447061552997",
            appId: "1:447061552997:web:d5b4fd5d148e93b81e7b8c"
        };
        
        // 서버 연결 대기 상태 (필요 시 주석 해제 후 연동 가능)
        // const app = initializeApp(firebaseConfig);
        // console.log("Firebase Standby.");
    </script>

    <!-- 앱 핵심 구동 스크립트 -->
    <script>
        // --- 앱 데이터 상태 ---
        // 폴더 및 폴더 내의 파일 객체 저장
        const folders = {
            '기본 재생목록': [] // { name: "곡 이름", file: File 객체, url: Blob URL }
        };
        let currentOpenFolder = '';

        // 현재 '플리(대기열)' 
        let playQueue = []; 
        let currentSongIndex = -1;
        
        // 플레이어 상태
        let isPlaying = false;
        let isShuffle = false;
        let repeatMode = 0; // 0: 반복없음, 1: 전체반복, 2: 한곡반복

        // DOM 요소
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const progress = document.getElementById('progress');
        const progressContainer = document.getElementById('progressContainer');
        const albumArt = document.getElementById('albumArt');
        
        // --- 1. 뷰 및 네비게이션 전환 ---
        window.showView = function(viewId, activeNavId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');

            if (activeNavId) {
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById(activeNavId).classList.add('active');
            }
            if(viewId === 'playlistsView') renderFolderList();
        }

        // --- 2. 재생목록(폴더) 관리 ---
        function renderFolderList() {
            const ul = document.getElementById('folderList');
            ul.innerHTML = '';
            for (let folderName in folders) {
                const li = document.createElement('li');
                li.className = 'list-item';
                li.onclick = () => openFolder(folderName);
                li.innerHTML = `
                    <span class="text">${folderName} <span style="color:#ccc; font-size:12px;">(${folders[folderName].length})</span></span>
                    <span class="material-symbols-outlined icon">chevron_right</span>
                `;
                ul.appendChild(li);
            }
        }

        window.createNewFolder = function() {
            const name = prompt("새 재생목록 이름을 입력하세요:", "새 재생목록");
            if (name && !folders[name]) {
                folders[name] = [];
                renderFolderList();
            } else if (folders[name]) {
                alert("이미 존재하는 이름입니다.");
            }
        }

        window.openFolder = function(folderName) {
            currentOpenFolder = folderName;
            document.getElementById('detailFolderName').innerText = folderName;
            renderFolderDetail();
            showView('folderDetailView', 'nav-list');
        }

        function renderFolderDetail() {
            const ul = document.getElementById('detailSongList');
            ul.innerHTML = '';
            const songs = folders[currentOpenFolder];
            
            if(songs.length === 0) {
                ul.innerHTML = `<p style="text-align:center; color:#ccc; font-size:13px; margin-top:30px;">등록된 곡이 없습니다.<br>+ 곡 추가 버튼을 눌러주세요.</p>`;
                return;
            }

            songs.forEach((song, index) => {
                const li = document.createElement('li');
                li.className = 'list-item';
                li.innerHTML = `
                    <span class="text" onclick="addToQueueAndPlay('${currentOpenFolder}', ${index})">${song.name}</span>
                    <span class="material-symbols-outlined delete-btn" onclick="deleteFromFolder(${index})">close</span>
                `;
                ul.appendChild(li);
            });
        }

        window.addSongsToCurrentFolder = function(input) {
            const files = Array.from(input.files);
            files.forEach(file => {
                folders[currentOpenFolder].push({
                    name: file.name.replace(/\.[^/.]+$/, ""), // 확장자 제거
                    file: file,
                    url: URL.createObjectURL(file) // 로컬 구동용 임시 URL 생성
                });
            });
            input.value = ''; 
            renderFolderDetail();
        }

        window.deleteFromFolder = function(index) {
            event.stopPropagation(); // 재생 방지
            folders[currentOpenFolder].splice(index, 1);
            renderFolderDetail();
        }

        // --- 3. 플리(대기열) 관리 및 재생 ---
        window.addToQueueAndPlay = function(folderName, songIndex) {
            const song = folders[folderName][songIndex];
            
            // 이미 대기열에 있는지 확인
            const existIndex = playQueue.findIndex(q => q.url === song.url);
            if(existIndex === -1) {
                playQueue.push(song);
                currentSongIndex = playQueue.length - 1;
            } else {
                currentSongIndex = existIndex;
            }

            renderQueue();
            loadSong(currentSongIndex);
            playAudio();
            showView('playerView', 'nav-player');
        }

        function renderQueue() {
            const ul = document.getElementById('nowPlayingList');
            document.getElementById('emptyPliText').style.display = playQueue.length ? 'none' : 'block';
            ul.innerHTML = '';

            playQueue.forEach((song, index) => {
                const li = document.createElement('li');
                li.className = `list-item ${index === currentSongIndex ? 'playing-now' : ''}`;
                li.innerHTML = `
                    <span class="text" style="${index === currentSongIndex ? 'color:#ff6b81; font-weight:500;' : ''}" onclick="playFromQueue(${index})">${song.name}</span>
                    <span class="material-symbols-outlined delete-btn" onclick="removeFromQueue(${index})">close</span>
                `;
                ul.appendChild(li);
            });
        }

        window.playFromQueue = function(index) {
            currentSongIndex = index;
            renderQueue();
            loadSong(currentSongIndex);
            playAudio();
            showView('playerView', 'nav-player');
        }

        window.removeFromQueue = function(index) {
            event.stopPropagation();
            playQueue.splice(index, 1);
            if(index === currentSongIndex) {
                pauseAudio();
                if(playQueue.length > 0) {
                    currentSongIndex = 0;
                    loadSong(currentSongIndex);
                } else {
                    document.getElementById('title').innerText = "선택된 곡 없음";
                    document.getElementById('artist').innerText = "재생목록에서 곡을 추가하세요";
                    audio.src = '';
                }
            } else if (index < currentSongIndex) {
                currentSongIndex--;
            }
            renderQueue();
        }

        // --- 4. 오디오 컨트롤 (핵심 기능) ---
        function loadSong(index) {
            if(index < 0 || index >= playQueue.length) return;
            const song = playQueue[index];
            document.getElementById('title').innerText = song.name;
            document.getElementById('artist').innerText = "로컬 오디오 재생 중";
            audio.src = song.url;
        }

        function playAudio() {
            if(playQueue.length === 0) return;
            isPlaying = true;
            audio.play();
            playBtn.innerHTML = '<span class="material-symbols-outlined">pause</span>';
            albumArt.classList.add('playing');
        }

        function pauseAudio() {
            isPlaying = false;
            audio.pause();
            playBtn.innerHTML = '<span class="material-symbols-outlined">play_arrow</span>';
            albumArt.classList.remove('playing');
        }

        playBtn.addEventListener('click', () => {
            isPlaying ? pauseAudio() : playAudio();
        });

        // 프로그레스 바 업데이트
        audio.addEventListener('timeupdate', () => {
            if(audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progress.style.width = `${percent}%`;
            }
        });

        // 프로그레스 바 클릭하여 이동
        progressContainer.addEventListener('click', (e) => {
            if(!audio.duration) return;
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        });

        // 곡 종료 시 자동 다음 곡
        audio.addEventListener('ended', () => {
            if(repeatMode === 2) { // 한 곡 반복
                playAudio();
            } else {
                nextSong();
            }
        });

        // 이전/다음 곡 버튼
        document.getElementById('prevBtn').addEventListener('click', () => {
            if(playQueue.length === 0) return;
            currentSongIndex--;
            if (currentSongIndex < 0) currentSongIndex = playQueue.length - 1;
            renderQueue();
            loadSong(currentSongIndex);
            playAudio();
        });

        function nextSong() {
            if(playQueue.length === 0) return;
            
            if (isShuffle) {
                currentSongIndex = Math.floor(Math.random() * playQueue.length);
            } else {
                currentSongIndex++;
                if (currentSongIndex > playQueue.length - 1) {
                    currentSongIndex = 0; // 끝까지 가면 처음으로
                    if(repeatMode === 0) { // 반복 끄기 상태면 재생 멈춤
                        loadSong(currentSongIndex);
                        renderQueue();
                        pauseAudio();
                        return;
                    }
                }
            }
            renderQueue();
            loadSong(currentSongIndex);
            playAudio();
        }
        document.getElementById('nextBtn').addEventListener('click', nextSong);

        // 셔플(랜덤) 버튼
        const shuffleBtn = document.getElementById('shuffleBtn');
        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active-state', isShuffle);
        });

        // 반복 버튼 상태
        const repeatBtn = document.getElementById('repeatBtn');
        repeatBtn.addEventListener('click', () => {
            repeatMode = (repeatMode + 1) % 3;
            if(repeatMode === 0) {
                repeatBtn.classList.remove('active-state');
                repeatBtn.innerHTML = '<span class="material-symbols-outlined">repeat</span>';
            } else if(repeatMode === 1) {
                repeatBtn.classList.add('active-state');
                repeatBtn.innerHTML = '<span class="material-symbols-outlined">repeat</span>';
            } else if(repeatMode === 2) {
                repeatBtn.classList.add('active-state');
                repeatBtn.innerHTML = '<span class="material-symbols-outlined">repeat_one</span>';
            }
        });

        // 초기화
        renderFolderList();

    </script>
</body>
</html>
